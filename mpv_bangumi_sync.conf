# mpv_bangumi_sync v1.0.0配置示例
# 将此文件复制到 script-opts/mpv_bangumi_sync.conf 后修改配置值。

# Bangumi 访问令牌（必填）
# https://next.bgm.tv/demo/access-token
bgm_access_token=your_access_token

# Bangumi API URL。必须使用完整 URL，不支持 api.bgm.tv 这种裸域名。
# 请自行确认 API URL 的安全性；因使用第三方 API URL 产生的问题，本插件不负责。
bangumi_api=https://api.bgm.tv

# Bangumi API 代理。留空表示禁用。
# 示例：
# bgm_proxy=http://127.0.0.1:7890
# bgm_proxy=socks5://127.0.0.1:7890
# bgm_proxy=socks5h://127.0.0.1:7890
bgm_proxy=

# 存储路径组 1。Windows 使用分号分隔，Linux/Mac 使用冒号分隔。
# 示例：
# storage1=D:/Anime;E:/Anime
# storage1=/home/user/Anime:/mnt/nas/Anime
storage1=your_anime_storage_path

# 存储路径组 2。Windows 使用分号分隔，Linux/Mac 使用冒号分隔。
storage2=your_anime_storage_path

# 批量同步阈值。
# 当存储路径组中的待同步剧集数量达到阈值时立即同步。
# 0 表示不按数量自动同步；退出时仍会同步待处理剧集。
storage1_batch_sync_threshold=1
storage2_batch_sync_threshold=4

# 自动标记已看剧集。
# yes：更新条目和剧集状态
# no：只显示信息，不写入状态
enable_auto_mark=yes

# 播放进度达到此比例时标记为已看（0~1）。
progress_mark_threshold=0.9


# 网络 URL 完整文件域名/IP 列表，逗号分隔。
# 命中的 host 会按完整文件处理：通过 Range 获取前 16MB 计算 hash，再走弹弹play匹配。
# 示例：
# network_file_hosts=example.com,192.168.1.10
network_file_hosts=